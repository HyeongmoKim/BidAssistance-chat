name: Trigger auto deployment for aivleachatbot

on:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Azure 로그인용 (OIDC)
      contents: read

    steps:
      # 1. 깃허브에서 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Docker Registry(ACR) 로그인
      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: aivleacr-fpc4geatahfjhygz.azurecr.io
          username: ${{ secrets.AIVLEACHATBOT_REGISTRY_USERNAME }}
          password: ${{ secrets.AIVLEACHATBOT_REGISTRY_PASSWORD }}

      # 3. [중요] Docker 이미지 빌드 및 푸시 (Oryx를 쓰지 않고 표준 Docker 기능 사용)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: aivleacr-fpc4geatahfjhygz.azurecr.io/aivleachatbot:${{ github.sha }}
          file: ./Dockerfile  # Dockerfile이 루트에 있다고 가정

      # 4. Azure 로그인
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AIVLEACHATBOT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AIVLEACHATBOT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AIVLEACHATBOT_AZURE_SUBSCRIPTION_ID }}

      # 5. Azure Container Apps에 "새 이미지 배포해"라고 명령만 내리기 (빌드 과정 생략)
      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: Aivle08
          containerAppName: aivleachatbot
          imageToDeploy: aivleacr-fpc4geatahfjhygz.azurecr.io/aivleachatbot:${{ github.sha }}
          # appSourcePath, dockerfilePath 옵션을 다 뺐기 때문에 Oryx가 실행되지 않습니다.