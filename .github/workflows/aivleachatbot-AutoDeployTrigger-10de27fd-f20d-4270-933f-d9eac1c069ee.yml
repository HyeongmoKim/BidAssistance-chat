name: Trigger auto deployment for aivleachatbot

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches:
      [ main ]
    paths:
    - '**'
    - '.github/workflows/aivleachatbot-AutoDeployTrigger-10de27fd-f20d-4270-933f-d9eac1c069ee.yml'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AIVLEACHATBOT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AIVLEACHATBOT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AIVLEACHATBOT_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: Dockerfile
          _targetLabelKey_: _targetLabel_
          registryUrl: aivleacr-fpc4geatahfjhygz.azurecr.io
          registryUsername: ${{ secrets.AIVLEACHATBOT_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.AIVLEACHATBOT_REGISTRY_PASSWORD }}
          containerAppName: aivleachatbot
          resourceGroup: Aivle08
          imageToBuild: aivleacr-fpc4geatahfjhygz.azurecr.io/aivleachatbot:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


